services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build: ./apps/web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: receiptiq
      POSTGRES_PASSWORD: receiptiq
      POSTGRES_DB: receiptiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptiq"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
